apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: traefik-gateway
      sectionName: web
      namespace: traefik
  hostnames:
    - {{ .Values.service.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ .Release.Name }}
          port: 80


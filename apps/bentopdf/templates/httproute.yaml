apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf
spec:
  parentRefs:
    - name: traefik-gateway
      sectionName: web
      namespace: traefik
  hostnames:
    - {{ .Values.route.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bentopdf
          port: 80


image:
  repository: nousresearch/hermes-agent
  tag: "1.0.0"

service:
  host: hermes.example.com
  port: 80
  targetPort: 8080

persistence:
  size: 2Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

resources: {}

extraEnv: []
extraArgs: []

httproute:
  enabled: true
  gatewayName: traefik-gateway
  gatewayNamespace: traefik
  sectionName: web

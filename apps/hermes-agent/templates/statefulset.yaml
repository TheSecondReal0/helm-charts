apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
{{- with .Values.podSecurityContext }}
      securityContext:
{{ toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - "./docker/entrypoint.sh"
          args:
            - "gateway"
            - "run"
{{- with .Values.extraArgs }}
{{ toYaml . | nindent 12 }}
{{- end }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: gateway
{{- if .Values.dashboard.enabled }}
            - containerPort: {{ .Values.dashboard.targetPort }}
              name: dashboard
{{- end }}
          env:
{{- if .Values.dashboard.enabled }}
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: {{ .Values.dashboard.bindHost | quote }}
            - name: HERMES_DASHBOARD_PORT
              value: {{ .Values.dashboard.port | quote }}
{{- end }}
            - name: GIT_SSH_COMMAND
              value: "ssh -i /root/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-forgejo
                  key: token
{{- with .Values.extraEnv }}
{{ toYaml . | nindent 12 }}
{{- end }}
          resources:
            {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: git
              mountPath: /root/.ssh
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
      volumes:
        - name: git
          secret:
            secretName: {{ .Release.Name }}-git
            defaultMode: 256
  volumeClaimTemplates:
    - metadata:
        name: data
{{- with .Values.persistence.annotations }}
        annotations:
{{ toYaml . | nindent 10 }}
{{- end }}
      spec:
        accessModes:
{{ toYaml .Values.persistence.accessModes | nindent 10 }}
{{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
